name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  # FNCONFIG with the FujiNet logo (fujinet-config branch h89-changes); move to
  # main when it merges
  CONFIG_REF: a4d4ab651e6f0f45f615d94a8a7d5bbe065e1665
  # The C2H mode word (fujinet-lib #228), the drain fix (#155) and no DIR or
  # /OE, for the card without its 74LVC245 (#249); back to upstream main when
  # #155 and #249 merge
  FUJINET_LIB_H89: https://github.com/tschak909/fujinet-lib.git#h89-setup-after-reset

  # NetCat (NC.COM, NC.ABS) with BREAK to hang up, on fujinet-lib 5.1.1
  NETCAT_REF: 85388ba99c71eb1da21d8fd38da98a65f23f8ae4

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: fozztexx/defoogi:1.4.8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: FujiNetWIFI/fujinet-config
          ref: ${{ env.CONFIG_REF }}
          path: fujinet-config

      - uses: actions/checkout@v7
        with:
          repository: FujiNetWIFI/netcat
          ref: ${{ env.NETCAT_REF }}
          path: netcat

      - name: Build NetCat
        run: make -C netcat h89-cpm h89-hdos

      - name: Build FNCONFIG
        run: make -C fujinet-config FUJINET_LIB_H89="$FUJINET_LIB_H89" h89

      - name: Build
        run: |
          make
          make tools-disk CONFIG=fujinet-config/r2r/h89-cpm/config.com NC=netcat/r2r/h89-cpm/nc.com
          make hdos-tools-disk CONFIG_ABS=fujinet-config/r2r/h89-hdos/config.abs NC_ABS=netcat/r2r/h89-hdos/nc.abs
          make autorun CONFIG_ABS=fujinet-config/r2r/h89-hdos/config.abs

      - name: Test the host tools
        run: make check

      - name: Collect
        run: |
          mkdir -p dist
          cp build/{FNDISK.COM,NPIP.COM,fndisk-cpm.h8d,fujinet-cpm.h8d} dist/
          cp build/{FN.DVD,LP.DVD,NPIP.ABS,fn-hdos.h8d,fujinet-hdos.h8d} dist/
          cp build/{fnboot.bin,stage2.bin,autorun.img} dist/
          cp fujinet-config/r2r/h89-cpm/config.com dist/FNCONFIG.COM
          cp fujinet-config/r2r/h89-hdos/config.abs dist/FNCONFIG.ABS
          cp netcat/r2r/h89-cpm/nc.com dist/NC.COM
          cp netcat/r2r/h89-hdos/nc.abs dist/NC.ABS

      - uses: actions/upload-artifact@v7
        with:
          name: fujinet-h89
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: fujinet-h89
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { cat .github/release-notes.md
            echo
            echo "FNCONFIG is FujiNetWIFI/fujinet-config@${CONFIG_REF}."
            echo "NetCat is FujiNetWIFI/netcat@${NETCAT_REF}."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
